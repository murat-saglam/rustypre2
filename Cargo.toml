[package]
name = "rustypre2"
version = "0.1.0"
edition = "2024"
description = "rustypre2 — Native Rust engine and runtime for Prehistorik 2"
license = "GPL-3.0-only"

[dependencies]
sdl2 = "0.37"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
