name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rustypre2-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rustypre2-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rustypre2-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2

      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.32.0/SDL2-devel-2.32.0-VC.zip" -OutFile "SDL2.zip"
          Expand-Archive -Path "SDL2.zip" -DestinationPath "SDL2"
          Copy-Item "SDL2/SDL2-2.32.0/lib/x64/SDL2.lib" -Destination "."
          Copy-Item "SDL2/SDL2-2.32.0/lib/x64/SDL2.dll" -Destination "."

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/rustypre2/game_data
          cp target/${{ matrix.target }}/release/rustypre2 dist/rustypre2/
          cp README.md CHANGELOG.md LICENSE dist/rustypre2/
          tar -czf ${{ matrix.artifact_name }} -C dist rustypre2

      - name: Package Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/rustypre2/game_data" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rustypre2.exe" -Destination "dist/rustypre2/"
          Copy-Item "SDL2.dll" -Destination "dist/rustypre2/"
          Copy-Item "README.md", "CHANGELOG.md", "LICENSE" -Destination "dist/rustypre2/"
          Compress-Archive -Path "dist/rustypre2" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
